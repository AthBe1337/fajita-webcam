<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fajita Camera</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="header">
    <h1>Fajita Camera</h1>
    <div id="cam-buttons"></div>
</div>

<div class="main">
    <div class="video-panel">
        <img id="stream" src="/stream/mjpeg" alt="Camera stream">
        <div class="video-overlay" id="overlay">--</div>
    </div>

    <div class="controls">
        <div class="section">
            <div class="section-title">Exposure</div>
            <div class="control-row">
                <label>Exposure</label>
                <input type="range" id="exposure" min="0" max="1000" value="500">
                <span class="value" id="exposure-val">--</span>
            </div>
            <div class="control-row">
                <label>Analog Gain</label>
                <input type="range" id="analogue_gain" min="0" max="960" value="0">
                <span class="value" id="analogue_gain-val">--</span>
            </div>
            <div class="control-row">
                <label>Digital Gain</label>
                <input type="range" id="digital_gain" min="0" max="4096" value="256">
                <span class="value" id="digital_gain-val">--</span>
            </div>
            <div class="toggle-row">
                <div class="toggle" id="ae-toggle" onclick="toggleAE()"></div>
                <label style="font-size:13px">Auto Exposure</label>
            </div>
            <div class="control-row" id="ae-target-row" style="display:none">
                <label>AE Target</label>
                <input type="range" id="ae-target" min="10" max="200" value="50">
                <span class="value" id="ae-target-val">50</span>
            </div>
        </div>

        <div class="section" id="focus-section">
            <div class="section-title">Focus</div>
            <div class="control-row">
                <label>Position</label>
                <input type="range" id="focus" min="0" max="2047" value="0">
                <span class="value" id="focus-val">--</span>
            </div>
            <div style="display:flex;gap:6px;margin-top:4px">
                <button class="btn primary" onclick="triggerAF()">AF Once</button>
                <button class="btn" id="caf-btn" onclick="toggleCAF()">Continuous AF</button>
            </div>
            <div class="status-row" style="margin-top:6px">
                AF: <span id="af-state">idle</span>
            </div>
        </div>

        <div class="section">
            <div class="section-title">White Balance</div>
            <div class="toggle-row">
                <div class="toggle on" id="awb-toggle" onclick="toggleAWB()"></div>
                <label style="font-size:13px">Auto WB</label>
            </div>
            <div class="control-row">
                <label>R Gain</label>
                <input type="range" id="r_gain" min="50" max="400" value="100" step="1">
                <span class="value" id="r_gain-val">1.00</span>
            </div>
            <div class="control-row">
                <label>B Gain</label>
                <input type="range" id="b_gain" min="50" max="400" value="100" step="1">
                <span class="value" id="b_gain-val">1.00</span>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Stream</div>
            <div class="control-row">
                <label>Quality</label>
                <input type="range" id="quality" min="10" max="100" value="80">
                <span class="value" id="quality-val">80</span>
            </div>
            <div class="control-row">
                <label>Max FPS</label>
                <input type="range" id="fps" min="1" max="30" value="15">
                <span class="value" id="fps-val">15</span>
            </div>
            <div style="margin-top:6px">
                <label style="font-size:13px;color:#bbb;margin-bottom:4px;display:block">Resolution</label>
                <div class="ds-btns">
                    <button class="ds-btn" onclick="setDS(1)">Full</button>
                    <button class="ds-btn" onclick="setDS(2)">1/2</button>
                    <button class="ds-btn active" onclick="setDS(4)">1/4</button>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Status</div>
            <div class="status-row">FPS: <span id="st-fps">--</span></div>
            <div class="status-row">Frame size: <span id="st-jpeg">--</span></div>
            <div class="status-row">Brightness: <span id="st-bright">--</span></div>
        </div>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
